<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>gswaMIDIParser</title>
</head>
<body>
<script src="../vendor/orpheus-gs-utils/gs-utils.js"></script>
<script src="../vendor/orpheus-gs-utils/gs-utils-json.js"></script>
<script src="gswaMIDIParser.js"></script>
<script src="gswaMIDIToKeys.js"></script>
<script>

fetch( "sample.mid" )
	.then( res => res.arrayBuffer() )
	.then( arr => {
		const midi = gswaMIDIParser.$parse( new Uint8Array( arr ) );

		console.log( "midi", midi );

		const keys = gswaMIDIToKeys.$convert( midi );

		console.log( "keys", keys );
	} );

</script>
</body>
</html>
