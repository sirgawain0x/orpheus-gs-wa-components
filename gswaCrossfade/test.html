<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>gswaCrossfade / Wavetable Test</title>
</head>
<body>
<p>Open the console for results.</p>
<script src="../../orpheus-gs-utils/gs-utils.js"></script>
<script src="../../orpheus-gs-utils/gs-utils-json.js"></script>
<script src="../../orpheus-gs-utils/gs-utils-audio.js"></script>
<script src="../../orpheus-gs-utils/gs-utils-fft.js"></script>
<script src="../../orpheus-gs-utils/gs-utils-models.js"></script>
<script src="../gswaPeriodicWaves/gswaPeriodicWaves.js"></script>
<script src="gswaCrossfade.js"></script>
<script src="../gswaOscillator/gswaOscillator.js"></script>
<script>
( async () => {
	const ctx = new AudioContext();
	const results = [];

	try {
		gswaCrossfade.$PATH = "gswaCrossfadeProc.js";
		await gswaCrossfade.$loadModule( ctx );
		results.push( "worklet loaded" );
	} catch ( err ) {
		results.push( "worklet FAILED: " + err.message );
	}

	const wtName = GSUformatWavetableName( 1, 1 );
	const curveA = GSUgetModel( "wavetable" ).waves[ 0 ].curve;
	const curveB = GSUdeepCopy( curveA );

	curveB[ 1 ].y = -.8;
	gswaPeriodicWaves.$addWavetable( wtName, {
		0: { index: 0, curve: curveA },
		1: { index: 1, curve: curveB },
	} );
	results.push( "wavetable waves: " + gswaPeriodicWaves.$getWavetable( ctx, wtName ).length );

	const osc = new gswaOscillator( ctx );

	osc.$type = wtName;
	osc.$connect( ctx.destination );
	osc.$start( ctx.currentTime + .1, 440 );
	results.push( "oscillator started" );

	await ctx.resume();
	await new Promise( r => setTimeout( r, 200 ) );
	osc.$setWavetableAtTime( 1, ctx.currentTime );
	results.push( "index morphed to 1" );

	gswaPeriodicWaves.$delete( wtName );
	results.push( "wavetable deleted, cache: " + JSON.stringify( gswaPeriodicWaves.$debug() ) );

	console.log( "WAVETABLE TEST:", results.join( " | " ) );
} )();
</script>
</body>
</html>
